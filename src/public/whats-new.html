<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's New — NearByBazar</title>
  <meta name="description" content="Platform updates, new features, and improvements to NearByBazar.">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-elevated: #263148;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --accent2: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: rgba(148, 163, 184, 0.15);
      --radius: 18px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    h1, h2, h3, .brand { font-family: 'Outfit', sans-serif; }

    a { color: inherit; text-decoration: none; }

    .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px 80px; }

    /* ── Header ── */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 860px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
    .brand i { color: var(--accent); margin-right: 6px; }
    .back-link {
      font-size: 0.85rem; color: var(--text-secondary);
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .back-link:hover { color: var(--text-primary); border-color: var(--accent); }

    /* ── Hero ── */
    .hero { text-align: center; padding: 56px 0 32px; }
    .hero .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--accent); background: var(--accent-glow);
      padding: 6px 14px; border-radius: 999px; margin-bottom: 18px;
    }
    .hero h1 { font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 800; letter-spacing: -0.03em; }
    .hero p { color: var(--text-secondary); max-width: 520px; margin: 14px auto 0; font-size: 1.02rem; }

    /* ── Search ── */
    .search-row { margin: 28px 0 8px; position: relative; }
    .search-row i {
      position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
      color: var(--text-secondary);
    }
    #wn-search {
      width: 100%; padding: 14px 18px 14px 46px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px;
      color: var(--text-primary); font-size: 0.95rem; font-family: inherit;
      transition: border-color 0.2s;
    }
    #wn-search:focus { outline: none; border-color: var(--accent); }
    #wn-search::placeholder { color: var(--text-secondary); }

    /* ── Release card ── */
    .release {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px; margin-top: 24px;
      position: relative; overflow: hidden;
    }
    .release::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
    }
    .release-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; margin-bottom: 6px; }
    .badge-version {
      font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.82rem;
      color: var(--accent); background: var(--accent-glow);
      padding: 4px 12px; border-radius: 999px;
    }
    .release-date { color: var(--text-secondary); font-size: 0.85rem; }
    .release-sprint { color: var(--text-secondary); font-size: 0.78rem; margin-left: auto; opacity: 0.8; }
    .release h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 10px; }
    .release-summary { color: var(--text-secondary); font-size: 1rem; margin-bottom: 18px; }

    .group { margin-top: 20px; }
    .group-title {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 0.82rem;
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px;
    }
    .group-title .dot { width: 8px; height: 8px; border-radius: 50%; }
    .g-features .dot { background: var(--accent); } .g-features { color: #a5b4fc; }
    .g-improvements .dot { background: var(--success); } .g-improvements { color: #6ee7b7; }
    .g-bugfixes .dot { background: var(--accent2); } .g-bugfixes { color: #fcd34d; }
    .g-performance .dot { background: #38bdf8; } .g-performance { color: #7dd3fc; }
    .g-security .dot { background: var(--danger); } .g-security { color: #fca5a5; }
    .g-impact .dot { background: #a78bfa; } .g-impact { color: #c4b5fd; }

    /* ── Impact ("who benefits") ── */
    .impact-grid {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }
    .impact-row {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
    }
    .impact-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--text-secondary); margin-bottom: 6px;
    }
    .impact-text { font-size: 0.92rem; color: var(--text-primary); }

    .group ul { list-style: none; display: grid; gap: 8px; }
    .group li {
      position: relative; padding-left: 26px; color: var(--text-primary);
      font-size: 0.95rem;
    }
    .group li::before {
      content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      position: absolute; left: 0; top: 1px; font-size: 0.72rem; color: var(--text-secondary);
    }

    /* ── States ── */
    .state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
    .state i { font-size: 2.4rem; margin-bottom: 14px; opacity: 0.5; display: block; }
    .skeleton {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); height: 180px; margin-top: 24px;
      position: relative; overflow: hidden;
    }
    .skeleton::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(148,163,184,0.08), transparent);
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 100% { transform: translateX(100%); } }

    .footer { text-align: center; color: var(--text-secondary); font-size: 0.82rem; margin-top: 48px; }

    @media (max-width: 560px) {
      .release { padding: 20px; }
      .release-sprint { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand"><i class="fas fa-store"></i>NearByBazar</a>
      <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to app</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <span class="eyebrow"><i class="fas fa-bolt"></i> Platform Updates</span>
      <h1>What's New</h1>
      <p>Every improvement we ship to NearByBazar — new features, refinements, and fixes that make discovering and running local businesses better.</p>

      <div class="search-row">
        <i class="fas fa-search"></i>
        <input id="wn-search" type="search" placeholder="Search updates, features, versions…" autocomplete="off" />
      </div>
    </section>

    <section id="wn-list" aria-live="polite">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>

    <p class="footer">You're all caught up. Thanks for building local with NearByBazar. 🧡</p>
  </main>

  <script src="/js/whats-new.js"></script>
</body>
</html>
