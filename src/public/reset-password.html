<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NearByBazar</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      padding: 20px;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }
    .brand { font-weight: 700; font-size: 22px; color: #6366f1; margin-bottom: 4px; }
    h1 { font-size: 20px; margin: 0 0 6px; color: #111827; }
    p.sub { color: #6b7280; font-size: 14px; margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 15px; margin-bottom: 16px; outline: none;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    button {
      width: 100%; padding: 13px; border: none; border-radius: 8px; cursor: pointer;
      background: #6366f1; color: #fff; font-size: 15px; font-weight: 600;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { font-size: 14px; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .msg.error { display: block; background: #fef2f2; color: #b91c1c; }
    .msg.success { display: block; background: #f0fdf4; color: #15803d; }
    .foot { text-align: center; margin-top: 18px; font-size: 14px; }
    .foot a { color: #6366f1; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">NearByBazar</div>
    <h1>Set a new password</h1>
    <p class="sub">Choose a strong password you don't use elsewhere.</p>

    <div class="msg" id="message"></div>

    <form id="reset-form">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" placeholder="Re-enter your password" minlength="6" required>

      <button type="submit" id="submit-btn">Reset Password</button>
    </form>

    <div class="foot"><a href="/">← Back to NearByBazar</a></div>
  </div>

  <script src="/js/reset-password.js"></script>
</body>
</html>
