services:
  - type: web
    name: hyperlocal-backend
    env: node
    plan: free
    region: ohio
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      # Required (set the values in the Render dashboard)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Launch config (safe defaults; override in dashboard to expand)
      - key: ENABLED_VERTICALS
        value: FOOD_BEVERAGE,GROCERY,SALON_BEAUTY,HEALTH_MEDICAL
      - key: DEFAULT_STATE
        value: Haryana
      # Optional integrations — app boots fine without these
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
